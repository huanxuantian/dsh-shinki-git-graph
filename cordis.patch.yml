# dsh-shinki-git-graph bundle patch: inserts the dual-face plugin row into the
# web profile roster. Applied as a profile bundle layer (the dsh.bundle.patch
# manifest field). The node half (exports ".") runs in the host process
# (git service + /shinki-git/* HTTP routes); the dsh.client declaration in
# package.json makes the browser half (exports "./client", served at
# /plugins/<id>/client.js) load in the web GUI.
- insert:
    - id: dsh-shinki-git-graph
      name: 'dsh-shinki-git-graph'
